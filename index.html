<script>
const params=new URLSearchParams(location.search);let screen=params.get('screen')||'pending';let lastTask='t1',selectedSentiment='',selectedTags=[],comment='',nativeSelection='';
const tasks=[
 {id:'t1',agent:'Agent Alex',avatar:'👩🏻',date:'Oct 26, 2026 · 09:12',due:'Expires in 6 days',status:'pending',services:[{icon:'◈',title:'VIP Coins received',time:'Oct 26 · 09:12',amount:'10 Coins'}]},
 {id:'t2',agent:'Agent Lily',avatar:'👩🏼',date:'Oct 24, 2026 · 15:28',due:'Expires in 4 days',status:'pending',services:[{icon:'◈',title:'VIP Coins received',time:'Oct 24 · 15:28',amount:'25 Coins'},{icon:'◷',title:'Timeout-Slots completed',time:'Oct 24 · 16:02',amount:'VIP Coins used'}]},
 {id:'t3',agent:'Agent Mark',avatar:'👨🏽',date:'Oct 25, 2026 · 18:40',due:'Reviewed Oct 25',status:'reviewed',sentiment:'positive',services:[{icon:'◆',title:'Diamonds received',time:'Oct 25 · 18:40',amount:'50 Diamonds'}],tags:['Quick Response','Helpful'],comment:'Great service, very helpful and friendly!',detailStatus:'added'},
 {id:'t4',agent:'Agent John',avatar:'👨🏻',date:'Oct 22, 2026 · 11:05',due:'Reviewed Oct 22',status:'reviewed',sentiment:'okay',services:[{icon:'◆',title:'Diamonds received',time:'Oct 22 · 11:05',amount:'20 Diamonds'}],tags:[],comment:'',detailStatus:'not_added'}
];
const labels={negative:'Negative',okay:'Okay',positive:'Positive'};
const tagSets={negative:['Slow Response','Problem Not Resolved','Poor Attitude','Unclear Information','Other'],okay:['Response Could Be Faster','Information Could Be Clearer','Other'],positive:['Quick Response','Helpful','Friendly','Clear Communication']};
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.style.display='none',2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shell(content){return `<main class="webview"><header class="topbar"><div class="brandIcon">▣</div><div><div class="topTitle">Service Feedback</div><div class="topSub">Help us improve agent service.</div></div><button class="closeBtn" aria-label="Close and return to game" title="Close and return to game" onclick="closeH5()">×</button></header>${content}</main>`}
function tabs(reviewed){return `<div class="tabs"><button class="tab ${!reviewed?'active':''}" onclick="go('pending')">Pending (${tasks.filter(t=>t.status==='pending').length})</button><button class="tab ${reviewed?'active':''}" onclick="go('reviewed')">Reviewed (${tasks.filter(t=>t.status==='reviewed').length})</button></div>`}
function taskCard(t){let isPending=t.status==='pending';const sent=t.sentiment;let stateLabel=isPending?'Pending':labels[sent]||'Reviewed';let stateClass=isPending?'pending':sent==='negative'?'negative':sent==='positive'?'positive':'reviewed';let action=isPending?`<button class="primary" onclick="openDetail('${t.id}')">Rate Now</button>`:(t.detailStatus!=='added'?`<button class="secondary" onclick="openDetail('${t.id}')">Add Details</button>`:`<button class="secondary" onclick="openReview('${t.id}')">View Review</button>`);return `<article class="task"><div class="taskHead"><div class="avatar">${t.avatar}</div><div style="min-width:0;flex:1"><div class="taskName">${t.agent}</div><div class="taskDate">${t.date}</div></div><span class="status ${stateClass}">${stateLabel}</span></div><div class="serviceChips">${[...new Set(t.services.map(s=>s.title))].map(s=>`<span class="chip">${s}</span>`).join('')}</div><div class="taskFoot"><div class="due ${!isPending?'done':''}">${isPending?t.due:(t.detailStatus==='added'?(t.tags?.length?`${t.tags.length} tags added`:'Details added'):'Details not added')}</div>${action}</div></article>`}
function listView(reviewed=false){let list=tasks.filter(t=>reviewed?t.status==='reviewed':t.status==='pending');let cards=list.length?list.map(taskCard).join(''):`<div class="empty"><div><div style="font-size:25px;margin-bottom:6px">✓</div><strong>${reviewed?'No reviewed records':'You’re all caught up'}</strong><br>${reviewed?'Submitted ratings will appear here.':'New eligible service reviews will appear here.'}</div></div>`;const content=`<div class="main"><div class="listLayout"><aside class="introPanel"><div class="eyebrow">AGENT SERVICE</div><h1>Service Feedback</h1><p class="subtext">Review your recent service experience. Each task is available for 7 days.</p><div class="summary"><div class="summaryCard"><div class="summaryNum">${tasks.filter(t=>t.status==='pending').length}</div><div class="summaryLabel">Pending reviews</div></div><div class="summaryCard"><div class="summaryNum">${tasks.filter(t=>t.status==='reviewed').length}</div><div class="summaryLabel">Reviewed</div></div></div>${tabs(reviewed)}<div class="policyNote">Only successful agent services are eligible. Tasks expire 7 days after creation. Closing this page returns you to the game.</div></aside><section class="listPanel"><div class="listHeading"><strong>${reviewed?'Reviewed in the last 7 days':'Needs your feedback'}</strong><span>Newest first · ${list.length} records</span></div><div class="taskGrid">${cards}</div></section></div></div>`;return shell(content)}
function serviceRows(t){return t.services.map(s=>`<div class="serviceRow"><div class="serviceIcon">${s.icon}</div><div class="serviceText"><div class="serviceTitle">${s.title}</div><div class="serviceDate">${s.time}</div></div><div class="serviceAmount">${s.amount}</div></div>`).join('')}
function sentimentCards(value,disabled=false){return `<div class="sentimentRow">${['negative','okay','positive'].map(k=>`<button class="sentiment ${k} ${value===k?'selected':''}" ${disabled?'disabled':''} onclick="selectSentiment('${k}')"><div class="face">${k==='negative'?'☹':k==='okay'?'😐':'☺'}</div><div><strong>${labels[k]}</strong><span>${k==='negative'?'Not satisfied':k==='okay'?'Average':'Satisfied'}</span></div></button>`).join('')}</div>`}
function detailView(){let t=tasks.find(x=>x.id===lastTask)||tasks[0];let isAdd=t.status==='reviewed';let s=isAdd?(t.sentiment||''):selectedSentiment;let tags=tagSets[s||'negative'];let existingTags=selectedTags;let val=comment;return shell(`<div class="main"><div class="detailLayout"><aside class="detailSummary"><div class="backRow"><button class="back" onclick="go('${isAdd?'reviewed':'pending'}')">‹</button><div class="backTitle">${isAdd?'Add Service Details':'Rate Your Agent'}</div></div><div class="agentHero"><div class="avatar">${t.avatar}</div><div><div class="agentName">${t.agent}</div><div class="agentMeta">${isAdd?'Satisfaction rating already saved':'Your recent service experience'}<br>${t.date}</div></div></div><div class="panelTitle">Services included</div><p class="panelSub">Successful services linked to this task.</p><div class="serviceList">${serviceRows(t)}</div><div class="expires">${isAdd?'Rating submitted':t.due+' · Philippines time'}</div></aside><section class="formPanel"><div class="formTop"><div><div class="formTitle">How was your experience?</div><div class="formSub">${isAdd?'Your rating is saved. You can add details below.':'Choose one option. Tags and comments are optional.'}</div></div>${isAdd?`<span class="savedBadge">✓ ${labels[s]||'Rated'}</span>`:''}</div>${sentimentCards(s,isAdd)}<div class="detailBody"><div class="detailBlock"><div class="panelTitle">${s==='negative'?'What went wrong?':s==='positive'?'What did you like?':s==='okay'?'What could be improved?':'Feedback tags'}</div><p class="panelSub">Choose up to 3 tags (optional).</p><div class="tagGrid">${(s?tags:[]).map(tag=>`<button class="tag ${existingTags.includes(tag)?'selected':''}" onclick="toggleTag('${esc(tag)}')">${existingTags.includes(tag)?'✓ ':''}${tag}</button>`).join('')||`<span class="tiny">Select a satisfaction option to see related tags.</span>`}</div></div><div class="detailBlock"><label class="label" for="comment">Tell us more (Optional)</label><textarea id="comment" class="textarea" maxlength="200" placeholder="Share details about your experience..." oninput="comment=this.value;document.getElementById('count').textContent=this.value.length+'/200'">${esc(val)}</textarea><div class="counter" id="count">${val.length}/200</div></div></div><div class="formActions">${isAdd?`<button class="secondary" onclick="go('reviewed')">Back</button><button class="primary" onclick="saveDetails()">Save Details</button>`:`<button class="secondary" onclick="go('pending')">Cancel</button><button class="primary" ${s?'':'disabled'} onclick="submitReview()">Submit Review</button>`}</div><div class="helper">One rating per task. You cannot change a submitted satisfaction choice. Supplemental feedback can be added while the task is valid.</div></section></div></div>`)}
function reviewDetail(){let t=tasks.find(x=>x.id===lastTask)||tasks.find(x=>x.status==='reviewed');let sent=t.sentiment||'okay';return shell(`<div class="main"><div class="reviewDetailLayout"><aside class="detailSummary"><div class="backRow"><button class="back" onclick="go('reviewed')">‹</button><div class="backTitle">Review Details</div></div><div class="agentHero"><div class="avatar">${t.avatar}</div><div><div class="agentName">${t.agent}</div><div class="agentMeta">${t.date}<br>Services completed</div></div></div><div class="panelTitle">Service details</div><div class="serviceList">${serviceRows(t)}</div></aside><section class="reviewPanel"><div class="formTop"><div><div class="formTitle">Your review</div><div class="formSub">Submitted feedback for this service task.</div></div><span class="savedBadge">✓ Submitted</span></div><div class="reviewCard"><div class="reviewCardTitle">Satisfaction</div><span class="status ${sent==='negative'?'negative':sent==='positive'?'positive':'reviewed'}">${labels[sent]}</span></div><div class="reviewCard"><div class="reviewCardTitle">Feedback tags</div>${t.tags&&t.tags.length?`<div class="tagGrid">${t.tags.map(tag=>`<span class="tag selected">✓ ${tag}</span>`).join('')}</div>`:`<p class="panelSub">No additional tags submitted.</p>`}</div><div class="reviewCard"><div class="reviewCardTitle">Your comment</div><div class="reviewComment">${t.comment?esc(t.comment):'No written comment submitted.'}</div></div><div class="reviewBtns"><button class="secondary" onclick="go('reviewed')">Back to Reviews</button>${t.detailStatus!=='added'?`<button class="primary" onclick="openDetail('${t.id}')">Add Details</button>`:''}</div></section></div></div>`)}
function gameView(withModal=false){return `<div class="gamePreview"><div class="gameLogo">LUCKY<br><span style="font-size:29px">BIG WINNER</span></div><div class="gameList"><div class="gameRow"></div><div class="gameRow"></div><div class="gameRow"></div><div class="gameRow"></div></div><div class="slotDecor"></div><button class="gameAction" onclick="go('pending')">SERVICE FEEDBACK</button>${withModal?`<div class="notice"><div class="nativeModal"><div class="nativeHead">HINT<button class="nativeX" onclick="nativeClose()">×</button></div><div class="nativeBody"><div class="nativeMessage">9Livess (37924921) sent you 10 Coins (Assets).</div><div class="nativeQuestion">How was your experience with this agent?</div><div class="nativeChoices">${['negative','okay','positive'].map(k=>`<button class="sentiment ${k} ${nativeSelection===k?'selected':''}" onclick="nativeSelection='${k}';render()"><div class="face">${k==='negative'?'☹':k==='okay'?'😐':'☺'}</div><div><strong>${labels[k]}</strong><span>${k==='negative'?'Not satisfied':k==='okay'?'Average':'Satisfied'}</span></div></button>`).join('')}</div><div class="nativeButtons"><button class="primary" ${nativeSelection?'':'disabled'} onclick="nativeSubmit()">Submit</button><button class="secondary" onclick="nativeClose()">Rate Later</button></div></div></div></div>`:''}</div>`}
function go(s){screen=s;if(s==='pending'||s==='reviewed'){selectedSentiment='';selectedTags=[];comment=''}try{history.replaceState(null,'','?screen='+s)}catch(e){}render()}
function openDetail(id){lastTask=id;let t=tasks.find(x=>x.id===id);selectedSentiment=t.status==='reviewed'?(t.sentiment||''):'';selectedTags=t.tags?[...t.tags]:[];comment=t.comment||'';screen='detail';render()}
function openReview(id){lastTask=id;screen='reviewDetail';render()}
function selectSentiment(s){let t=tasks.find(x=>x.id===lastTask);if(t?.status==='reviewed')return;selectedSentiment=s;selectedTags=[];render()}
function toggleTag(tag){let base=[...selectedTags];selectedTags=base.includes(tag)?base.filter(x=>x!==tag):base.length<3?[...base,tag]:base;render()}
function submitReview(){if(!selectedSentiment)return;let t=tasks.find(x=>x.id===lastTask);if(!t||t.status!=='pending')return;t.status='reviewed';t.sentiment=selectedSentiment;t.tags=[...selectedTags];t.comment=comment;t.detailStatus=(t.tags.length||t.comment)?'added':'not_added';toast('Rating submitted.');go('reviewed')}
function saveDetails(){let t=tasks.find(x=>x.id===lastTask);if(!t)return;t.tags=[...selectedTags];t.comment=comment;t.detailStatus='added';toast('Feedback details saved.');go('reviewed')}
function closeH5(){screen='game';nativeSelection='';render()}
function nativeClose(){screen='game';nativeSelection='';render();toast('Closed · You can review services in Service Feedback')}
function nativeSubmit(){if(!nativeSelection)return;let t=tasks[0];t.agent='9Livess';t.status='reviewed';t.sentiment=nativeSelection;t.tags=[];t.comment='';t.detailStatus='not_added';t.services=[{icon:'◈',title:'Coins (Assets) received',time:'Oct 26 · 09:12',amount:'10 Coins'}];screen='game';nativeSelection='';render();toast('Rating submitted. Add details later in Service Feedback.')}
function render(){let root=document.getElementById('root');if(screen==='native')root.innerHTML=gameView(true);else if(screen==='game')root.innerHTML=gameView(false);else if(screen==='detail')root.innerHTML=detailView();else if(screen==='reviewDetail')root.innerHTML=reviewDetail();else root.innerHTML=listView(screen==='reviewed')}
render();
</script></body></html>
